name: Implement a filed issue

# The overseer's own implementer. Everything it does lives in the reusable
# workflow next door (implementer.yml) — this file exists to say which repo,
# which toolchain, and which test command. So does each project repo's copy.
#
# Triggered by the repository_dispatch that scripts/dispatch_implement.py fires,
# or by hand for one issue. It ends at a pull request: nothing merges anything.

on:
  repository_dispatch:
    types: [overseer-implement]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to implement"
        required: true
        type: string
      tier:
        description: "Model tier for this attempt"
        type: choice
        default: light
        options: [light, heavy]
        required: false

permissions:
  contents: write        # push the branch
  pull-requests: write   # open the PR
  issues: write          # comment / close / label when it can't be implemented

# One run per issue. A duplicate dispatch (the label failed to apply, say)
# should not produce two branches racing to fix the same thing.
concurrency:
  group: implement-${{ github.event.client_payload.issue || inputs.issue }}
  cancel-in-progress: false

jobs:
  implement:
    uses: ./.github/workflows/implementer.yml
    with:
      issue: ${{ github.event.client_payload.issue || inputs.issue }}
      tier: ${{ github.event.client_payload.tier || inputs.tier }}
      python_version: "3.12"
      pip_cache: true
      install: pip install -r requirements.txt
      test_command: python -m pytest -q
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
