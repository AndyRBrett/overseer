name: Refresh Delivery Ledger

# Keeps the dashboard live instead of weekly.
#
# The ledger is pure GitHub reads — no Anthropic key, no agents, no model calls
# — so it is cheap enough to run constantly, unlike the weekly review it used to
# be bolted to. Before this, a PR merged on Tuesday still read "in flight" until
# the following Monday.
#
# THE CROSS-REPO PROBLEM: three of the four projects are separate repositories,
# and GitHub only fires pull_request/issues events in the repo where they
# happen. So local events give instant updates for the overseer's own work, and
# a short cron covers the other three. The alternative — repository_dispatch
# from each project repo — would be instant everywhere but needs a PAT with
# actions:write stored in three more places, which is exactly the credential
# sprawl that caused the July outage. The dispatch trigger is wired up anyway so
# it can be opted into per-repo (see README) without another workflow change.

on:
  # Instant for the overseer's own work.
  pull_request:
    types: [closed]
  issues:
    types: [closed, reopened]
  # Covers the other three repos. Hourly at :20 to stay clear of the weekly
  # review at :00 and the heartbeat at :00.
  schedule:
    - cron: "20 * * * *"
  # Opt-in instant path for project repos that choose to notify us.
  repository_dispatch:
    types: [ledger-refresh]
  workflow_dispatch:
    inputs:
      full:
        description: "Re-walk every issue instead of carrying settled outcomes forward"
        type: boolean
        default: false

permissions:
  contents: write

# One refresh at a time. Without this a merge event and the cron can land
# together and race to commit the same file. Not cancel-in-progress: a refresh
# that is already writing should finish rather than leave a half-written file.
concurrency:
  group: ledger-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # PyGithub only — the agent dependencies aren't needed for a read.
      - run: pip install "PyGithub>=2.1"

      - name: Rebuild the published files
        env:
          OVERSEER_GITHUB_TOKEN: ${{ secrets.OVERSEER_GITHUB_TOKEN }}
          TRADING_REPO: ${{ vars.TRADING_REPO }}
          VOLLEYBALL_REPO: ${{ vars.VOLLEYBALL_REPO }}
          UFC_REPO: ${{ vars.UFC_REPO }}
          FULL: ${{ inputs.full && '--full' || '' }}
        run: bash scripts/rebuild_docs.sh

      - name: Publish if anything moved
        env:
          OVERSEER_GITHUB_TOKEN: ${{ secrets.OVERSEER_GITHUB_TOKEN }}
          TRADING_REPO: ${{ vars.TRADING_REPO }}
          VOLLEYBALL_REPO: ${{ vars.VOLLEYBALL_REPO }}
          UFC_REPO: ${{ vars.UFC_REPO }}
          FULL: ${{ inputs.full && '--full' || '' }}
        run: |
          FILES="docs/shipped.json docs/ask-context.json docs/digest.json"
          git config user.name  "overseer-bot"
          git config user.email "overseer-bot@users.noreply.github.com"

          commit_if_moved() {
            if git diff --quiet -- $FILES; then
              return 1
            fi
            git add $FILES
            git commit -m "Refresh delivery ledger and project health"
          }

          if ! commit_if_moved; then
            echo "Nothing moved — nothing to publish."
            exit 0
          fi

          # The weekly review commits to the same branch, and on a busy repo the
          # remote can move between checkout and push.
          #
          # It must not be resolved by rebasing. These three files are DERIVED
          # and every line of them is generated, so a textual merge of two
          # versions is meaningless — and git conflicts on all three every time.
          # On 2026-09-14 the :20 refresh overlapped the weekly review's own
          # publish by two minutes: the rebase conflicted in all three files,
          # and the two remaining retries then died on "Pulling is not possible
          # because you have unmerged files" without ever attempting a push,
          # because nothing had cleaned the conflicted tree up. Three retries,
          # zero pushes, one red run over a file that was republished an hour
          # later anyway.
          #
          # The right resolution for a derived file is to take whatever landed
          # first and RECOMPUTE on top of it — never to merge, and never to force
          # our copy over it. Ours would clobber the weekly digest with a digest
          # rebuilt from the previous one, and `generated` with it, which is the
          # one field the dead-man's switch reads (invariant 13).
          #
          # No backoff between attempts: each one now does a full rebuild
          # against GitHub first, which is seconds of real work, and a sleep on
          # top of it only widens the window for the next writer to land.
          for i in 1 2 3; do
            git push && exit 0
            echo "push failed (attempt $i) — rebuilding onto the new main"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            bash scripts/rebuild_docs.sh
            if ! commit_if_moved; then
              echo "Whatever landed first is already current — nothing left to publish."
              exit 0
            fi
          done
          exit 1
