name: Overseer Heartbeat

# Dead-man's switch for the weekly review (overseer #13 / #17).
#
# Deliberately a SEPARATE workflow from weekly-review.yml, not a step inside it:
# a job cannot detect its own failure to start. If the weekly cron lapses, the
# workflow is disabled, or the run dies before its first step, nothing in that
# file executes — but this one still fires and goes red.
#
# It needs no ANTHROPIC_API_KEY and no OVERSEER_GITHUB_TOKEN. That is the point:
# the outage it exists to catch was an expired GitHub token, so the alarm must
# not depend on the credential it is watching. Everything it checks comes from
# docs/digest.json in the checkout.

# THE ALARM SHARED THE SCHEDULER IT WATCHES (2026-08-31). All of the above is
# true and none of it fired that Monday: GitHub delivered no scheduled events at
# all, so the weekly review never ran AND this heartbeat never ran to say so. A
# dead-man's switch on the same cron system as the thing it watches has a common
# failure mode with it, which is the one thing a dead-man's switch may not have.
# The stale digest was caught by a human, days late.
#
# So this now also answers a repository_dispatch fired by the Cloudflare cron in
# worker/overseer-ask.js — the same off-GitHub path the review uses. That is
# what makes this the detector for a dropped weekly event: the review going
# missing stops docs/digest.json advancing, and this notices within ~24h.
on:
  schedule:
    # 15:00 UTC daily — a day after the Monday 14:00 weekly run, so a missed
    # review is caught within ~24h rather than at the end of the next week.
    - cron: "0 15 * * *"
  # The off-GitHub path, 15:20 UTC daily. Unguarded on purpose: this is a
  # tokenless, model-free check, so running twice costs a checkout, and an alarm
  # that fires twice while something is broken beats one that stays quiet.
  repository_dispatch:
    types: [heartbeat]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # No `pip install` step: heartbeat.py is standard-library only, so the
      # alarm keeps working even if the pipeline's dependencies stop resolving.
      - name: Check that the overseer is alive and seeing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/heartbeat.py
