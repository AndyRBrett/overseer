name: Weekly Project Review

# THE ONCE-A-WEEK PROBLEM. On 2026-08-17 this fired into nine seconds of 503s
# from api.github.com, aborted at the credential preflight, and the next attempt
# was seven days away — no digest, no push notification, and nothing that said
# so. A workflow that runs hourly can shrug off an outage; one that runs weekly
# cannot. Two layers now cover that, both keyed on the orchestrator exiting 75
# (EX_TEMPFAIL) for "GitHub was unreachable" and any other code for real
# failures, so a dead credential still stops on the first attempt:
#
#   1. in-job retries — three attempts over ~6 minutes, for an outage measured
#      in minutes. Cheap: the preflight runs before the first agent, so a
#      deferred attempt has spent nothing.
#   2. catch-up crons at 16:00 and 18:00 UTC, for an outage measured in hours.
#      They no-op unless today's digest is missing (scripts/weekly_guard.py), so
#      a healthy Monday costs a checkout and a file read.

on:
  schedule:
    # 14:00 UTC every Monday. Adjust to taste (cron is in UTC).
    - cron: "0 14 * * 1"
    # Catch-ups. These do nothing unless the 14:00 run failed to publish.
    - cron: "0 16 * * 1"
    - cron: "0 18 * * 1"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# Needed so the run can commit the updated digest back into docs/ (GitHub Pages).
permissions:
  contents: write

# The catch-ups exist to cover a missed run, not to race one that is still
# going: a 14:00 run retrying its way through an outage must not be joined by
# the 16:00 attempt. Not cancel-in-progress — the running review is the one with
# the budget already spent.
concurrency:
  group: weekly-review
  cancel-in-progress: false

jobs:
  overseer:
    runs-on: ubuntu-latest
    # The pipeline itself takes ~4 minutes; the rest is headroom for the retry
    # backoff (~6 min) plus a slow model call.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      # Only the catch-up crons ask this question. The 14:00 run and any manual
      # dispatch are the review — they always proceed.
      - name: Is today's digest still missing?
        id: guard
        env:
          FIRED_BY_SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/weekly_guard.py

      - if: steps.guard.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run overseer pipeline
        if: steps.guard.outputs.should_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OVERSEER_GITHUB_TOKEN: ${{ secrets.OVERSEER_GITHUB_TOKEN }}
          # Model tiers (all optional — see README "Model tiers"). Only the
          # Bug-Hunter runs on the heavy model by default; set
          # OVERSEER_LIGHT_MODEL to the same value as OVERSEER_MODEL to put the
          # whole pipeline back on one model without touching code.
          OVERSEER_MODEL: ${{ vars.OVERSEER_MODEL }}
          OVERSEER_LIGHT_MODEL: ${{ vars.OVERSEER_LIGHT_MODEL }}
          OVERSEER_HEAVY_AGENTS: ${{ vars.OVERSEER_HEAVY_AGENTS }}
          # Project repo slugs + data sources (set the ones you have):
          TRADING_REPO: ${{ vars.TRADING_REPO }}
          VOLLEYBALL_REPO: ${{ vars.VOLLEYBALL_REPO }}
          UFC_REPO: ${{ vars.UFC_REPO }}
          TRADING_DB_PATH: ${{ vars.TRADING_DB_PATH }}
          VOLLEYBALL_RESULTS_PATH: ${{ vars.VOLLEYBALL_RESULTS_PATH }}
          # Agent 3 (Reviewer) delivers the digest to Telegram (optional — the
          # tool reports "not_configured" and the run still succeeds if unset).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Exit 75 (EX_TEMPFAIL) means GitHub was unreachable and nothing was
        # spent, so wait and try again. Every other non-zero code is a real
        # failure and fails the step immediately — retrying a dead credential
        # just delays the diagnosis. `set +e` around the call is what lets the
        # code be inspected at all: under `bash -e` the step would die on the
        # first non-zero exit, and an `if` wrapper reports the *construct's*
        # status (0 when no branch runs), not the pipeline's.
        run: |
          for attempt in 1 2 3; do
            set +e
            python orchestrator.py
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if [ "$code" -ne 75 ]; then
              echo "Pipeline failed with exit $code — not a retryable failure."
              exit "$code"
            fi
            if [ "$attempt" -lt 3 ]; then
              wait=$((attempt * 120))
              echo "::notice title=Review deferred::GitHub unreachable on attempt $attempt; retrying in ${wait}s."
              sleep "$wait"
            fi
          done
          echo "::error title=Review abandoned::GitHub was unreachable across 3 attempts."
          exit 75

      - name: Publish digest to the web app
        if: steps.guard.outputs.should_run == 'true'
        # The hourly ledger refresh commits to this same branch — at :20 and on
        # every PR close — and the review takes ~4½ minutes between checkout and
        # push. When one lands inside that window the push is rejected, and
        # since "Send push notification" is the step after this one, a lost race
        # costs the notification as well as the publish. ledger-refresh.yml has
        # carried this retry for exactly that reason; this is the other half.
        #
        # -X theirs reads backwards: during a rebase "theirs" is the commit
        # being replayed — ours. That is the resolution we want on a collision,
        # because these three files are regenerated whole by a run that just
        # read GitHub, so the fresher complete file wins over a merge of two.
        run: |
          if git diff --quiet -- docs/digest.json docs/history.json docs/shipped.json; then
            echo "No digest change to publish."
            exit 0
          fi
          git config user.name  "overseer-bot"
          git config user.email "overseer-bot@users.noreply.github.com"
          git add docs/digest.json docs/history.json docs/shipped.json
          git commit -m "Weekly digest $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash origin main && git push && exit 0
            git rebase --abort || true
            echo "publish failed (attempt $i) — remote moved; retrying"
            sleep $((i * 5))
          done
          exit 1

      - name: Send push notification
        if: steps.guard.outputs.should_run == 'true'
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: python scripts/notify_push.py

      - name: Upload run report
        if: always()   # keep the visual even when the run fails — that's when you need it
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: overseer-report
          path: |
            overseer_report.html
            overseer_run.jsonl
          if-no-files-found: ignore
