# Deploy target for the voice front door. See worker/overseer-ask.js.
#
#   cd worker
#   npx wrangler secret put ANTHROPIC_API_KEY   # the same key the pipeline uses
#   npx wrangler secret put ASK_SHARED_SECRET   # any long random string
#   npx wrangler secret put DISPATCH_TOKEN
#   npx wrangler secret put TELEGRAM_BOT_TOKEN  # optional — the watchdog alert
#   npx wrangler secret put TELEGRAM_CHAT_ID    # optional — same pair the digest uses
#
# The TELEGRAM_* pair is what makes this a dead-man's switch rather than a
# trigger (issue #59). Without them the Worker still pokes GitHub, but a review
# that stops running goes unreported: every other failure path here ends in a
# console.error nobody reads. They are the same two secrets the weekly digest
# already uses, so there is no new credential to mint.
#   npx wrangler deploy
#
# DISPATCH_TOKEN is a PAT that can POST /repos/{owner}/{repo}/dispatches on
# DISPATCH_REPO. That endpoint wants **Contents: write** on a fine-grained token
# (or plain `repo` scope on a classic one) — NOT "Actions: write", which reads
# like the right answer for a thing that starts a workflow and is not.
#
# Run these from this directory. Wrangler resolves the Worker from the config
# file in the working directory; from anywhere else it walks the filesystem
# looking for one and fails somewhere unrelated (~/.Trash, memorably).
#
# Do not paste these lines with a trailing `# comment`: interactive zsh, which
# is macOS's default shell, does not set interactive_comments, so the `#` and
# everything after it arrive as arguments and the command dies on them.
#
# `wrangler secret put` takes the NAME on the command line and prompts for the
# value. Pasting the credential itself creates a secret named after your token,
# echoes it to the terminal, and leaves the real slot empty — surfacing much
# later as an unrelated-looking failure. `npx wrangler secret list` settles it in
# one line; a credential that has been echoed anywhere gets revoked, not reasoned
# about.
#
# PACK_URL is a plain var, not a secret: it points at a file that is already
# public on GitHub Pages alongside digest.json. Nothing in the pack is private,
# and a test asserts it stays that way.

name = "overseer-ask"
main = "overseer-ask.js"
compatibility_date = "2026-08-01"

[vars]
PACK_URL = "https://andyrbrett.github.io/overseer/ask-context.json"
ASK_MODEL = "claude-sonnet-5"
DISPATCH_REPO = "AndyRBrett/overseer"

# THE WEEKLY REVIEW'S OFF-GITHUB TRIGGER (2026-08-31).
#
# GitHub dropped all three of the review's scheduled events that Monday — no
# runs created at all, so none of the workflow's own retries or catch-up crons
# could engage. Those catch-ups are schedule: entries in the same workflow,
# queued through the same deprioritised scheduler, so they were never redundancy
# against this. Cloudflare's scheduler is, and this Worker was already deployed.
#
# 14:05 is five minutes after GitHub's own 14:00 cron, so a Monday GitHub
# handles normally is untouched: the dispatch arrives second, weekly_guard.py
# sees today's digest and no-ops. 17:05 is the backup for a failed POST — not
# for a failed review, which the workflow's own retries own.
#
# 15:20 daily is the heartbeat, the dead-man's switch that goes red when the
# review stops happening. It was on GitHub's 15:00 daily cron and was dropped on
# 08-31 along with everything else — an alarm sharing the scheduler it watches is
# not an alarm. It is tokenless and makes no model calls, so running it twice on
# a day GitHub also delivers costs a checkout; and a duplicate alert on a day it
# is genuinely failing is the right way to be wrong.
#
# Cron is UTC here too. Keep DISPATCH_EVENTS in overseer-ask.js in step with
# these, and with the repository_dispatch `types:` in each workflow.
[triggers]
crons = ["5 14 * * 1", "5 17 * * 1", "20 15 * * *"]
