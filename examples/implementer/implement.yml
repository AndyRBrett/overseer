# Drop-in implementer for a project the overseer reviews.
#
# Copy this to .github/workflows/implement.yml IN YOUR PROJECT REPO (not in the
# overseer), then edit the four `with:` values at the bottom for your stack.
# That is the whole file: the implementer itself is a reusable workflow in the
# overseer, so the prompt, the author guard, the tier mapping and the failure
# handling are maintained in ONE place rather than copied into every repo.
#
# It used to be copied. A two-line fix then meant five edits across four repos,
# and a security sweep hardened three copies and missed two. That is why this
# is now ten lines of configuration instead of two hundred of duplication.
#
# WHY THE JOB STILL RUNS HERE. The agent needs your tests, your dependencies and
# your conventions, and it pushes to this repo. A called workflow runs against
# the CALLING repo, so the code and the Anthropic key stay yours — only the
# instructions are shared.
#
# SETUP (once per repo):
#   0. Settings → Actions → General → Workflow permissions → tick "Allow GitHub
#      Actions to create and approve pull requests". Off by default, and it
#      fails LATE: the run does all the work, pushes the branch, and only then
#      can't open the PR — while still reporting success.
#   1. Add secret ANTHROPIC_API_KEY.
#   2. Give the agent a token that makes its pull requests get CI — see the
#      note below. Without one everything still runs; the PRs just arrive
#      unchecked, and the workflow says so in its log. This is the step people
#      skip, and skipping it is invisible until a P1 reaches main.
#   3. Fill in the toolchain + test command below.
#   4. In the OVERSEER repo, make sure OVERSEER_GITHUB_TOKEN has
#      Actions: write and Issues: write on this repo — otherwise the dispatch
#      is rejected and the overseer reports it as a failed hand-over.
#
# NOTE ON CI: GitHub raises no workflow events for anything done with the
# built-in GITHUB_TOKEN, so a pull request opened with it gets no test run and
# no review bot. The agent is told to run the suite itself before opening one,
# but that is the agent grading its own homework: on 2026-09-07 the first two
# implementer PRs anyone reviewed each carried a P1 bug that their own passing
# suite did not catch. Give it a token of its own and your normal checks run on
# its PRs like any other contributor's.
#
# HOW COMPLETELY THIS SILENCES THINGS, measured in the overseer repo: 72 commits
# pushed to main by ledger-refresh with the built-in token produced ZERO runs of
# a Tests workflow that triggers `on: push: branches: [main]`. Not a red run, not
# a skipped one — no run. That is the same suppression the agent's PRs get, on a
# branch someone would have noticed.
#
# TWO THINGS ARE MISSING, and they are not the same thing. Your CI needs a
# WORKFLOW RUN, which only a non-GITHUB_TOKEN credential creates — there is no
# way around that. Codex is a separate vendor's App, and it auto-reviews pull
# requests opened by a person: in the overseer repo #81 and #83 got a review
# unasked, and #78 and #82, opened by the built-in token, got none until a human
# typed `@codex review` by hand. A token fixes both at once, because a PR opened
# with one is an ordinary PR. The implementer's prompt also asks for the Codex
# review itself now, which needs no credential — treat that as insurance for a
# repo you have not given a token to yet, not as the fix.
#
# AND CODEX NEEDS AN ENVIRONMENT FOR THE REPO before it will review anything.
# Nothing in this workflow can detect that: it warns about the TOKEN, and with a
# token present everything on this side is correct while reviews silently never
# arrive. One per repo, at chatgpt.com/codex/cloud/settings/environments.
#
# TWO WAYS, and they are not interchangeable:
#
#   PREFERRED — a GitHub App. Create one, install it on this repo, and add its
#   id and private key as OVERSEER_PR_APP_ID and OVERSEER_PR_APP_PRIVATE_KEY.
#   The workflow mints an installation token per run: scoped to this repo and
#   expiring within the hour.
#
#   OVERSEER_PR_APP_ID and OVERSEER_PR_APP_PRIVATE_KEY are the secret NAMEs —
#   type them into GitHub's Name box exactly as written. The App id (a number)
#   and the private key (the whole PEM) are the VALUEs that go in the Value box
#   below each one. Putting the App id into the Name box instead fails with
#   "Secret names can only contain alphanumeric characters... Spaces are not
#   allowed", which reads like a naming-policy problem and not like the two
#   fields being swapped. Both secrets are required together — set only one
#   and the workflow logs a warning and falls back to OVERSEER_PR_TOKEN or the
#   built-in token.
#
#   An App installation token is NOT something you paste into a secret. It dies
#   in about an hour, and an expired secret is still non-empty — so the
#   fallback would not engage and every run after the first hour would fail
#   authentication, an hour after you last saw it work.
#
#   OTHERWISE — a FINE-GRAINED personal access token as OVERSEER_PR_TOKEN,
#   created by the account that OWNS this repo.
#
#   It has to be the owner, and this is the trap. A fine-grained token is scoped
#   to a SINGLE resource owner and reaches only repositories under it; being an
#   outside collaborator on another person's repo does not bridge that gap. So a
#   separate machine user CANNOT create one for a repo owned by a person. The
#   token it produces authenticates perfectly and then 404s on the agent's first
#   `gh issue view`, which reads like a permissions typo rather than a
#   credential that was never capable of the job. This file recommended exactly
#   that setup until Codex flagged it on PR #84, before anyone had followed it.
#
#   What owner-creating it costs: the pull requests arrive authored by YOU, so
#   the author column no longer says which changes were machine-written — and
#   the whole reason this file exists is that the least human-authored change
#   was getting the least scrutiny. Live with it anyway. The branch is
#   `overseer/issue-<n>`, the body ends `Closes #<n>`, and the issue carries
#   `overseer:implementing`; the provenance is legible three other ways.
#
#   IF YOU WANT THE BOT AUTHOR LINE, the machine user needs a CLASSIC token,
#   which does work as a collaborator. Know what you are buying: classic scopes
#   are not per-repo, so `repo` hands that account's full write access to EVERY
#   repo it can reach, on every run, to an agent running Bash. The owner's
#   fine-grained token is one repo and three permissions. Prefer it.
#
#   Set an EXPIRY — 90 days is a reasonable default. A fine-grained token can be
#   given one (7/30/60/90 days, or custom up to 366); "no expiration" is a choice
#   you have to make, not a property of the thing. Unlike an App token, expiry
#   here is safe: the run fails loudly on a 401 rather than silently falling back.
#
#   Scope it to THIS REPO ALONE. One token per repo, never one token spanning
#   all four — the agent runs Bash, and a token scoped to four repos is write
#   access to four repos in every single run.
#
# EITHER WAY IT NEEDS THREE PERMISSIONS: contents:write, pull-requests:write and
# issues:write. Not two. This token is the credential for every `gh` command the
# agent runs, not just `gh pr create` — the prompt opens with `gh issue view`,
# and an issue it judges obsolete is closed with `gh issue close`. Without the
# issue permissions a private-repo run dies on its first command, and a public
# one fails the close quietly, leaving the issue eligible so the same
# investigation is paid for again next week.

name: Implement a filed issue

on:
  repository_dispatch:
    types: [overseer-implement]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to implement"
        required: true
        type: string
      tier:
        description: "Model tier for this attempt"
        type: choice
        default: light
        options: [light, heavy]
        required: false

permissions:
  contents: write        # push the branch
  pull-requests: write   # open the PR
  issues: write          # comment / close / label when it can't be implemented

concurrency:
  group: implement-${{ github.event.client_payload.issue || inputs.issue }}
  cancel-in-progress: false

jobs:
  implement:
    uses: AndyRBrett/overseer/.github/workflows/implementer.yml@main
    with:
      issue: ${{ github.event.client_payload.issue || inputs.issue }}
      tier: ${{ github.event.client_payload.tier || inputs.tier }}

      # ── EDIT ME ──────────────────────────────────────────────────────────
      # Leave a toolchain empty to skip it. `pip_cache` only where a
      # requirements file exists — setup-python fails caching without one.
      python_version: "3.12"
      pip_cache: true
      # node_version: "20"
      install: pip install -r requirements.txt
      # The command YOUR ci runs. Named in the prompt so the agent tests the way
      # you do instead of inferring it from .github/workflows.
      test_command: python -m pytest -q
      # Optional: extra suites, and when they apply.
      # test_note: "If you touched the web assets, also run `npm run verify`."
      # ─────────────────────────────────────────────────────────────────────
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      # All three optional; the App pair wins where both are set. With none of
      # them the PR is opened with GITHUB_TOKEN and gets no CI and no review —
      # the workflow logs a warning saying exactly that.
      pr_app_id: ${{ secrets.OVERSEER_PR_APP_ID }}
      pr_app_private_key: ${{ secrets.OVERSEER_PR_APP_PRIVATE_KEY }}
      pr_token: ${{ secrets.OVERSEER_PR_TOKEN }}
