# Drop-in implementer for a project the overseer reviews.
#
# Copy this to .github/workflows/implement.yml IN YOUR PROJECT REPO (not in the
# overseer), then edit the four `with:` values at the bottom for your stack.
# That is the whole file: the implementer itself is a reusable workflow in the
# overseer, so the prompt, the author guard, the tier mapping and the failure
# handling are maintained in ONE place rather than copied into every repo.
#
# It used to be copied. A two-line fix then meant five edits across four repos,
# and a security sweep hardened three copies and missed two. That is why this
# is now ten lines of configuration instead of two hundred of duplication.
#
# WHY THE JOB STILL RUNS HERE. The agent needs your tests, your dependencies and
# your conventions, and it pushes to this repo. A called workflow runs against
# the CALLING repo, so the code and the Anthropic key stay yours — only the
# instructions are shared.
#
# SETUP (once per repo):
#   0. Settings → Actions → General → Workflow permissions → tick "Allow GitHub
#      Actions to create and approve pull requests". Off by default, and it
#      fails LATE: the run does all the work, pushes the branch, and only then
#      can't open the PR — while still reporting success.
#   1. Add secret ANTHROPIC_API_KEY.
#   2. Add secret OVERSEER_PR_TOKEN so the agent's pull requests get CI — see
#      the note below. Without it everything still runs; the PRs just arrive
#      unchecked, and the workflow says so in its log.
#   3. Fill in the toolchain + test command below.
#   4. In the OVERSEER repo, make sure OVERSEER_GITHUB_TOKEN has
#      Actions: write and Issues: write on this repo — otherwise the dispatch
#      is rejected and the overseer reports it as a failed hand-over.
#
# NOTE ON CI: GitHub raises no workflow events for anything done with the
# built-in GITHUB_TOKEN, so a pull request opened with it gets no test run and
# no review bot. The agent is told to run the suite itself before opening one,
# but that is the agent grading its own homework: on 2026-09-07 the first two
# implementer PRs anyone reviewed each carried a P1 bug that their own passing
# suite did not catch. OVERSEER_PR_TOKEN opens the PR instead, and your normal
# checks then run on it like any other contributor's.
#
# Prefer a GitHub App installation token (actions/create-github-app-token) to a
# personal access token: it is scoped to this repo and expires within the hour,
# where a PAT carries your whole account for as long as it exists. Either way it
# needs contents:write and pull-requests:write, and it is handed to an agent
# running Bash — so scope it to this repo and nothing else.

name: Implement a filed issue

on:
  repository_dispatch:
    types: [overseer-implement]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to implement"
        required: true
        type: string
      tier:
        description: "Model tier for this attempt"
        type: choice
        default: light
        options: [light, heavy]
        required: false

permissions:
  contents: write        # push the branch
  pull-requests: write   # open the PR
  issues: write          # comment / close / label when it can't be implemented

concurrency:
  group: implement-${{ github.event.client_payload.issue || inputs.issue }}
  cancel-in-progress: false

jobs:
  implement:
    uses: AndyRBrett/overseer/.github/workflows/implementer.yml@main
    with:
      issue: ${{ github.event.client_payload.issue || inputs.issue }}
      tier: ${{ github.event.client_payload.tier || inputs.tier }}

      # ── EDIT ME ──────────────────────────────────────────────────────────
      # Leave a toolchain empty to skip it. `pip_cache` only where a
      # requirements file exists — setup-python fails caching without one.
      python_version: "3.12"
      pip_cache: true
      # node_version: "20"
      install: pip install -r requirements.txt
      # The command YOUR ci runs. Named in the prompt so the agent tests the way
      # you do instead of inferring it from .github/workflows.
      test_command: python -m pytest -q
      # Optional: extra suites, and when they apply.
      # test_note: "If you touched the web assets, also run `npm run verify`."
      # ─────────────────────────────────────────────────────────────────────
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      # Optional. Absent, the PR is opened with GITHUB_TOKEN and gets no CI and
      # no review — the workflow logs a warning saying exactly that.
      pr_token: ${{ secrets.OVERSEER_PR_TOKEN }}
